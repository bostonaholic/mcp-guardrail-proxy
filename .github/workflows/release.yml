# Builds the proxy and the desktop app for every supported platform and attaches the files
# to the draft GitHub release for the pushed tag. The release-new-version skill creates that
# draft before it pushes the tag, then checks the files and publishes the release.
#
# A pull request that edits this file runs the builds and uploads nothing.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

env:
  TAURI_CLI_VERSION: "2.10.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: macos-arm64, bundles: dmg }
          - { runner: macos-15-intel, platform: macos-x86_64, bundles: dmg }
          # Ubuntu 22.04 keeps the glibc floor low, so the Linux files run on older distros.
          - { runner: ubuntu-22.04, platform: linux-x86_64, bundles: "deb,rpm,appimage" }
          - { runner: ubuntu-22.04-arm, platform: linux-arm64, bundles: "deb,rpm,appimage" }
    runs-on: ${{ matrix.runner }}
    env:
      PLATFORM: ${{ matrix.platform }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version and check it against the tag
        run: |
          version="$(jq -r .version desktop/tauri.conf.json)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match desktop/tauri.conf.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev xdg-utils

      - name: Install Rust and the Tauri CLI
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked

      - name: Build the proxy and check that it runs
        run: |
          cargo build --release --locked
          target/release/mcp-guardrail-proxy check-policy

      - name: Build the bundles
        working-directory: desktop
        run: cargo tauri build --bundles "$BUNDLES" --features self-install -- --locked

      - name: Give the bundles their release names
        run: |
          shopt -s nullglob
          mkdir dist
          for file in desktop/target/release/bundle/{dmg,deb,rpm,appimage}/*.{dmg,deb,rpm,AppImage}; do
            cp "$file" "dist/mcp-guardrail-desktop-$VERSION-$PLATFORM.${file##*.}"
          done
          # The updater payload has a two-part extension, so it gets its full name here.
          if [ "$RUNNER_OS" = macOS ]; then
            COPYFILE_DISABLE=1 tar -czf "dist/mcp-guardrail-desktop-$VERSION-$PLATFORM.app.tar.gz" \
              -C desktop/target/release/bundle/macos "MCP Guardrail.app"
          fi
          tar -czf "dist/mcp-guardrail-proxy-$VERSION-$PLATFORM.tar.gz" -C target/release mcp-guardrail-proxy
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Only this job reads the update signing key. It runs no build script: it installs
  # Ubuntu's minisign and runs render-update-manifest from this repository. A pull request
  # run signs with a throwaway key, so it needs no secret.
  sign:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # The full history holds the tag of the latest published release, whose public key
      # installed apps trust.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Read the version
        run: echo "VERSION=$(jq -r .version desktop/tauri.conf.json)" >> "$GITHUB_ENV"

      # Installed apps run a published release, so they trust the key of the latest one. A
      # tag whose release failed has only a draft, or no release, so this skips it.
      - name: Find the latest published release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/latest.err")"; then
            echo "LATEST_TAG=$latest_tag" >> "$GITHUB_ENV"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/latest.err"; then
            echo "No published release yet."
          else
            cat "$RUNNER_TEMP/latest.err" >&2
            exit 1
          fi

      - name: Write the release signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          UPDATE_KEY_LOST: ${{ vars.UPDATE_KEY_LOST }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::the UPDATE_SIGNING_KEY secret is empty (see .claude/skills/release-new-version/SKILL.md)"
            exit 1
          fi
          (umask 077 && printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update.key")
          # Installed apps check this release with the key of the release they run. A key
          # rotation tag carries the new key but is signed with the old one, so check against
          # the key of the latest published release. A tag uses its own key when there is no
          # published release, when that release has no key, and after a lost key.
          tagged_key="$(jq -r '.plugins.updater.pubkey // empty' desktop/tauri.conf.json)"
          trusted_key=""
          if [ "$UPDATE_KEY_LOST" = "true" ]; then
            echo "::warning::UPDATE_KEY_LOST is true, so installed apps cannot install this release. Delete the variable after this release."
          elif [ -n "$LATEST_TAG" ]; then
            if ! latest_commit="$(git rev-parse --verify --quiet "refs/tags/$LATEST_TAG^{commit}")"; then
              echo "::error::the tag $LATEST_TAG of the latest published release is not in this clone"
              exit 1
            fi
            # Early releases have no desktop/tauri.conf.json, so they have no key.
            if git cat-file -e "$latest_commit:desktop/tauri.conf.json" 2>/dev/null; then
              # Separate assignments, because the default shell has no pipefail and a pipe
              # would hide a git show failure.
              latest_config="$(git show "$latest_commit:desktop/tauri.conf.json")"
              trusted_key="$(printf '%s' "$latest_config" | jq -r '.plugins.updater.pubkey // empty')"
            fi
          fi
          if [ -z "$trusted_key" ]; then
            trusted_key="$tagged_key"
          elif [ "$trusted_key" != "$tagged_key" ]; then
            echo "::warning::this tag changes the update public key. Set UPDATE_SIGNING_KEY to the new key before the next tag."
          fi
          printf '%s' "$trusted_key" | base64 -d > "$RUNNER_TEMP/update.pub"

      - name: Make a throwaway signing key
        if: github.event_name == 'pull_request'
        run: minisign -G -W -p "$RUNNER_TEMP/update.pub" -s "$RUNNER_TEMP/update.key"

      # The updater reads the version from the trusted comment, so each comment must hold
      # exactly the fields and tabs that the Tauri CLI writes.
      - name: Sign the update payloads and write the manifest
        run: |
          mkdir sig manifest
          timestamp="$(date +%s)"
          tab="$(printf '\t')"
          for payload in "mcp-guardrail-desktop-$VERSION-macos-arm64.app.tar.gz" \
            "mcp-guardrail-desktop-$VERSION-macos-x86_64.app.tar.gz" \
            "mcp-guardrail-desktop-$VERSION-linux-x86_64.AppImage" \
            "mcp-guardrail-desktop-$VERSION-linux-arm64.AppImage"; do
            comment="timestamp:$timestamp${tab}file:$payload${tab}version:$VERSION"
            minisign -S -s "$RUNNER_TEMP/update.key" -m "dist/$payload" -x "sig/$payload.minisig" \
              -t "$comment" </dev/null
            minisign -V -p "$RUNNER_TEMP/update.pub" -m "dist/$payload" -x "sig/$payload.minisig"
            if [ "$(sed -n 3p "sig/$payload.minisig")" != "trusted comment: $comment" ]; then
              echo "::error::the trusted comment of $payload is not '$comment'"
              exit 1
            fi
          done
          .claude/skills/release-new-version/scripts/render-update-manifest "$VERSION" sig \
            > manifest/mcp-guardrail-desktop-update.json
          cat manifest/mcp-guardrail-desktop-update.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-manifest
          path: manifest/mcp-guardrail-desktop-update.json
          if-no-files-found: error

  # Only this job can write to the repository. The build jobs run third-party build
  # scripts, so they keep the read-only token.
  upload:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Attach the files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
