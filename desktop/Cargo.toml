[package]
name = "mcp-guardrail-desktop"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Tray app that watches the mcp-guardrail-proxy audit log, checks for updates, and has a Servers tab for MCP servers that the proxy does not wrap"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
toml_edit = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"

[features]
self-install = []

[dev-dependencies]
rustix = { version = "1", features = ["process"] }
tempfile = "3"
